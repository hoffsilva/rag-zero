[mypy]
python_version = 3.12
plugins = pydantic.mypy
strict = True
warn_unreachable = True
files = app, eval, tests, main.py, mcp_server.py, build_index.py

# Tests (top-level modules, no package): bodies are type-checked, but fixtures, fakes and
# helpers don't need full annotations.
[mypy-conftest,test_api,test_chunking,test_config,test_db,test_documents,test_eval_metrics,test_golden,test_langchain_rag,test_mcp_server,test_openai_client,test_rag,test_retrieval]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
warn_return_any = False
check_untyped_defs = True

[pydantic-mypy]
init_forbid_extra = True
# Settings(openai_api_key="...") coerces str to SecretStr, as Pydantic does at run time.
init_typed = False
warn_required_dynamic_aliases = True
