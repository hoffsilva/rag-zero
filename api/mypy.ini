[mypy]
python_version = 3.12
plugins = pydantic.mypy
strict = True
warn_unreachable = True
files = app, eval, tests, main.py, mcp_server.py, build_index.py

# Tests: function bodies are type-checked, but fixtures and helpers don't need full annotations.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
