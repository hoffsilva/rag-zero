name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: no job writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tags can be moved); the comment shows the version.
jobs:
  api:
    name: API tests (Python + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Throwaway database reachable only inside the job: no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12" # same as the Vercel Python runtime
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # No OpenAI key here: the suite blocks real API calls. TEST_DATABASE_URL enables the
      # pgvector integration tests against the service container above.
      - run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The action looks for package.json at the repo root and ignores working-directory.
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      # Generates the route types (LayoutProps, PageProps) that tsc needs; locally `next dev` does it.
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
