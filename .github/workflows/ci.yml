name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API tests (Python + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Vercel Python runtime
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # No OpenAI key here: the suite blocks real API calls. TEST_DATABASE_URL enables the
      # pgvector integration tests against the service container above.
      - run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Generates the route types (LayoutProps, PageProps) that tsc needs; locally `next dev` does it.
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
